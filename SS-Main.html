<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED DOCUMENTS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background: #111 url('https://www.transparenttextures.com/patterns/black-linen.png') repeat;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .hidden-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            font-size: 20px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            border: 3px solid #00ff00;
            border-radius: 15px; 
            padding: 20px; 
            position: relative; 
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .button {
            background-color: #00ff00;
            color: black;
            font-size: 24px;
            padding: 20px 40px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            font-weight: bold;
            opacity: 0;
            animation: fadeInUp 2s ease-in-out forwards;
            animation-delay: 1s;
        }

        @keyframes fadeInUp {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .button:hover {
            background-color: #00cc00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 1);
        }

        .button:active {
            background-color: #009900;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }

        .hidden-screen p {
            animation: typing 4s steps(40) 1s 1 normal both;
            white-space: nowrap;
            overflow: hidden;
            font-size: 22px;
            color: #0f0;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            opacity: 0;
            animation-delay: 0.5s;
        }

        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        .content {
            display: none;
            text-align: center;
            padding: 20px;
            color: #fff;
            background: linear-gradient(45deg, #1a1a1a, #333);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            width: 80%;
            max-width: 800px;
            animation: fadeIn 2s ease-in-out;
            border: 2px solid #00ff00;
            position: relative; 
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00cc00;
            animation: fadeInUp 2s ease-in-out forwards;
            animation-delay: 2s;
        }

        .content .youtube-player {
            width: 100%;
            height: 450px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            border: 2px solid #00ff00;
        }

        .content h1, .content .youtube-player {
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 15px #00ff00, 0 0 20px #00cc00, 0 0 25px #00cc00;
            }
            100% {
                text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00, 0 0 40px #00cc00, 0 0 50px #00cc00;
            }
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: blue;
        }

        .warning {
            font-size: 18px;
            color: #ff0000;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-in-out forwards;
            animation-delay: 2.5s;
        }

        .auth-required {
            font-size: 24px;
            color: #00ff00;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-in-out forwards;
            animation-delay: 1s;
        }

        .input-field {
            padding: 10px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            background-color: #333;
            color: #00ff00;
            width: 50%;
            text-align: center;
            box-shadow: 0 0 10px #00ff00;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s ease-in-out forwards;
            animation-delay: 1.5s;
        }

        .auth-message {
            position: relative; 
            width: 100%;
            text-align: center; 
            font-size: 24px; 
            color: #00ff00; 
            margin-bottom: 10px;
            opacity: 1; 
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .input-field {
                width: 80%; 
            }
            .button {
                font-size: 20px; 
                padding: 15px 30px; 
            }
            .content h1 {
                font-size: 2.5rem; 
            }
        }
    </style>
</head>
<body>

    <div class="hidden-screen" id="hiddenScreen">
        <p class="auth-required">AUTHENTICATION REQUIRED</p>
        <p class="auth-message">Authorising User...</p>
        <input type="password" id="clearanceCode" class="input-field" placeholder="Enter Clearance Code">
        <button class="button" id="revealButton">Access Clearance</button>
        <p class="warning">WARNING: CLASSIFIED DOCUMENTS CONTAINED WITHIN. AUTHORIZED PERSONNEL ONLY.</p>
    </div>

    <div class="content" id="content">
        <h1>CLASSIFIED DOCUMENTS</h1>
        <p class="warning">WARNING: CLASSIFIED DOCUMENTS CONTAINED WITHIN. AUTHORIZED PERSONNEL ONLY.</p>
        
        <!-- YouTube player will be created here -->
        <div id="player" class="youtube-player"></div>
    </div>

    <script>
        // Load the IFrame Player API code asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Create a YouTube player after the API code downloads
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '450',
                width: '100%',
                videoId: 'BBJa32lCaaY',
                playerVars: {
                    'autoplay': 1, // Autoplay the video
                    'mute': 1, // Mute the video for autoplay to work
                    'controls': 1, // Show controls
                    'showinfo': 0, // Hide video title and uploader
                    'rel': 0 // Do not show related videos at the end
                },
                events: {
                    'onReady': function(event) {
                        event.target.playVideo(); // Play the video when ready
                    }
                }
            });
        }

        document.getElementById("revealButton").addEventListener("click", function() {
            var clearanceCode = document.getElementById("clearanceCode").value;
            if (clearanceCode === "TS") {
                document.getElementById("hiddenScreen").style.display = "none";  
                document.getElementById("content").style.display = "block";    
            } else {
                alert("INVALID CLEARANCE CODE");
            }
        });
    </script>

</body>
</html>
