<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Hacker Terminal</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background: #111;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Initial hidden screen styling */
        .hidden-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            font-size: 20px;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Glowing button */
        .button {
            background-color: #00ff00;
            color: black;
            font-size: 24px;
            padding: 20px 40px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            font-weight: bold;
        }

        .button:hover {
            background-color: #00cc00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 1);
        }

        .button:active {
            background-color: #009900;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }

        /* Terminal-style animation for typing effect */
        .hidden-screen p {
            animation: typing 4s steps(40) 1s 1 normal both;
            white-space: nowrap;
            overflow: hidden;
            font-size: 22px;
            color: #0f0;
        }

        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        /* Content styling (hidden initially) */
        .content {
            display: none;
            text-align: center;
            padding: 20px;
            color: #fff;
            background: linear-gradient(45deg, #1a1a1a, #333);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            width: 80%;
            max-width: 800px;
            animation: fadeIn 2s ease-in-out;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #00ff00;
        }

        /* Video Styling */
        .content video {
            width: 100%;
            height: auto;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        /* Additional Glowing Effect for Text */
        .content h1, .content video {
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 15px #00ff00, 0 0 20px #00cc00, 0 0 25px #00cc00;
            }
            100% {
                text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00, 0 0 40px #00cc00, 0 0 50px #00cc00;
            }
        }

        /* Fancy scroll bar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background:blue;
        }

    </style>
</head>
<body>

    <div class="hidden-screen" id="hiddenScreen">
        <p>Initializing Secure Connection...</p>
        <p>Authenticating User...</p>
        <button class="button" id="revealButton">Press Enter to Continue</button>
    </div>

    <div class="content" id="content">
        <h1>MISSION 1</h1>
        <!-- Replace the "video.mp4" with the path to your local video file -->
        <video id="videoPlayer" autoplay="True" loop="True">
            <source src="SS.mp4" type="video/mp4">
        
        </video>
    </div>

    <script>
        // JavaScript to handle the reveal of the content
        document.getElementById("revealButton").addEventListener("click", function() {
            document.getElementById("hiddenScreen").style.display = "none";  // Hide the hidden screen
            document.getElementById("content").style.display = "block";     // Show the content
        });
    </script>

</body>
</html>
